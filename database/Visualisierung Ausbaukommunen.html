//=========================================================================================================================================================================
//====================== Hintergrund Layer ================================================================================================================================

var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, 
            maxZoom:21, 
            minZoom:1,
            zoomSnap: 0
        })

        var hash = new L.Hash(map);

        var bounds_group = new L.featureGroup([]);

        var basemaps = {
            Carto_DB: L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            {

            }
            ),
            OpenStreetMap: L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    attribution: '&copy; <a href="http://openstreetmap.org">OpenStreetMap</a>',
                    maxZoom: 22,
                    maxNativeZoom: 19,
                    opacity: 0.5,
                }
            )

        };

        var basemap0 = {};



        basemaps.OpenStreetMap.addTo(map);

        function setBounds() {

            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
            var southWest = L.latLng(map.getBounds().getSouthWest().lat.toFixed(3), map.getBounds().getSouthWest().lng.toFixed(3));
            var northEast = L.latLng(map.getBounds().getNorthEast().lat.toFixed(3), map.getBounds().getNorthEast().lng.toFixed(3));
            var newBounds = L.latLngBounds(southWest, northEast);
            map.setMaxBounds(newBounds);
        }
