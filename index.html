                var controlDivHeading = L.DomUtil.create('div', 'leaflet-control-layers-overlays', controlFormHeading);
                var controlLabelHeading = L.DomUtil.create('label', '', controlDivHeading);
                var controlDivInsideHeading = L.DomUtil.create('div', '', controlLabelHeading);

                var controlInputHeading = L.DomUtil.create('input', 'leaflet-control-layers-selector', controlDivInsideHeading);
                controlInputHeading.type = "checkbox";
                controlInputHeading.checked = true;

                var controlSpanHeading = L.DomUtil.create('span', '', controlDivInsideHeading);
                controlSpanHeading.innerHTML = "<b>Disclaimer</b>";

                var controlDivInfobox = L.DomUtil.create('div', '', controlDiv);

                controlInputHeading.onclick = function(){
                    controlDivInfobox.style.display = controlInputHeading.checked ? '' : 'none';
                }

                return controlDiv;
            },
        });

		var Infobox = new L.Control.Infobox();
        map.addControl(Infobox);
